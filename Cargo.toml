[package]
name = "backchannel"
version = "0.6.0"
edition = "2024"
description = "Open VS Code windows on your local machine from remote ssh sessions, tunneled over agent forwarding"
license = "MIT"

# The crate keeps the good name; the binary is short for fingers (rg/fd style).
[[bin]]
name = "back"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
humantime = "2"
libc = "0.2"
percent-encoding = "2"

[profile.release]
strip = true
