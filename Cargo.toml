[package]
name = "backchannel"
version = "0.11.1"
edition = "2024"
description = "Open projects and files on the host machine from within an ssh session, tunneled over agent forwarding"
license = "MIT"
rust-version = "1.88"  # let-chains (edition 2024 alone would only need 1.85)
repository = "https://github.com/codeinred/backchannel"
readme = "README.md"
keywords = ["ssh", "remote", "clipboard", "vscode", "agent-forwarding"]
categories = ["command-line-utilities", "development-tools", "network-programming"]
exclude = ["justfile", "tests/live.py"]

# The crate keeps the good name; the binary is short for fingers (rg/fd style).
[[bin]]
name = "back"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
humantime = "2"
libc = "0.2"
percent-encoding = "2"

[profile.release]
strip = true
