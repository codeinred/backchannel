[package]
name = "vs-connect"
version = "0.3.0"
edition = "2024"
description = "Open VS Code windows on your local machine from remote ssh sessions, tunneled over agent forwarding"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
humantime = "2"
libc = "0.2"
percent-encoding = "2"

[profile.release]
strip = true
